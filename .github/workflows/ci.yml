name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  compile-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 board support
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Install libraries
        run: |
          arduino-cli lib install "SparkFun MAX3010x Pulse and Proximity Sensor Library"
          arduino-cli lib install "Firebase Arduino Client Library for ESP8266 and ESP32"
      - name: Compile sketch
        run: arduino-cli compile --fqbn esp32:esp32:esp32 esp32-firmware
